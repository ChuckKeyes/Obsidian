<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download PDF Files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }
        h1 {
            color: #333;
        }
        .file-list {
            background: #fff;
            padding: 20px;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .file-list a {
            display: block;
            padding: 10px 0;
            color: #0073e6;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
        }
        .file-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Download PDF Files</h1>

    <div class="file-list">
        <!-- CHANGE THESE LINKS TO MATCH YOUR PDF FILENAMES -->
        <a href="myfile1.pdf" download>My File 1</a>
        <a href="myfile2.pdf" download>My File 2</a>
        <a href="resume.pdf" download>Resume</a>
        <a href="project-plan.pdf" download>Project Plan</a>
    </div>

</body>
</html>
