<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CK-Lab Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #222;
            background-image: url('images/background1.jpg'); /* Change as needed */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .overlay {
            background: rgba(255, 255, 255, 0.85);
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        h1, h2, h3, p {
            margin: 10px 0;
        }
        .images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }
        .images img {
            max-width: 220px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
    </style>
</head>

<body>
    <div class="overlay">
        <h1>CK-Lab Gallery</h1>
        <h2>Owner: Charles Keyes Sr.</h2>
        <p>Static website version (S3 Hosted)</p>

        <h3>Gallery</h3>
        <div class="images">
            <img src="images/dominican1.jpg" alt="Photo 1" />
            <img src="images/dominican2.jpg" alt="Photo 2" />
            <img src="images/dominican3.jpg" alt="Photo 3" />
            <img src="images/dominican4.jpg" alt="Photo 4" />
            <img src="images/dominican5.jpg" alt="Photo 5" />
            <img src="images/dominican6.jpg" alt="Photo 6" />
            <img src="images/dominican7.jpg" alt="Photo 7" />
            <img src="images/dominican7.jpg" alt="Photo 8" />
        </div>
    </div>
</body>
</html>
