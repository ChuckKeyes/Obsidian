#cloud-config
package_update: true
runcmd:
  - apt-get install -y docker.io docker-compose-plugin
  - usermod -aG docker ${USER}
  - mkdir -p /opt/grafana
  - bash -lc 'cat >/opt/grafana/docker-compose.yaml <<EOF
version: "3.9"
services:
  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data: {}
EOF'
  - docker compose -f /opt/grafana/docker-compose.yaml up -d
